name: Build LuaJIT
on: workflow_dispatch

jobs:
  build-luajit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: LuaJIT/LuaJIT
          ref: v2.1

      - name: Install gcc-multilib
        run: sudo apt-get install --no-install-recommends gcc-multilib

      - name: Build LuaJIT (armeabi-v7a)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/armv7a-linux-androideabi21-clang"

          make clean
          make amalg \
            HOST_CC="gcc -m32" \
            STATIC_CC="$cc" \
            DYNAMIC_CC="$cc -fPIC" \
            TARGET_LD="$cc" \
            TARGET_AR="$bin/llvm-ar rcus" \
            TARGET_STRIP="$bin/llvm-strip" \
            XCFLAGS="-DLUAJIT_DISABLE_FFI"

          mkdir armeabi-v7a
          mv src/libluajit.* armeabi-v7a

      - name: Build LuaJIT (arm64-v8a)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/aarch64-linux-android21-clang"

          make clean
          make amalg \
            HOST_CC="gcc" \
            STATIC_CC="$cc" \
            DYNAMIC_CC="$cc -fPIC" \
            TARGET_LD="$cc" \
            TARGET_AR="$bin/llvm-ar rcus" \
            TARGET_STRIP="$bin/llvm-strip" \
            XCFLAGS="-DLUAJIT_DISABLE_FFI"

          mkdir arm64-v8a
          mv src/libluajit.* arm64-v8a

      - uses: actions/upload-artifact@v7
        with: 
          name: ${{ github.job }}
          path: |
            armeabi-v7a
            arm64-v8a