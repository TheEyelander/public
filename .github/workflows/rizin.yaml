name: Rizin
on: workflow_dispatch
        
jobs:
  rizin:
    runs-on: ubuntu-26.04
    container: rizin/rizin:v0.9.1
    steps:
      - name: Rizin
        run: rizin -q -c "aaa; pdg" "$(curl -fsSLOJ -w "%{filename_effective}" "$test")" > rizin.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: rizin.txt