name: Rizin
on:
  workflow_dispatch:
    inputs:
      url:
        required: true

jobs:
  rizin:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - run: |
          apt-get install --no-install-recommends rizin rz-ghidra
          rizin -q -c "aa; pdg" "$(curl -LOJ -w "%{filename_effective}" "${{ inputs.url }}")" > "${{ github.job }}.txt"

      - uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
