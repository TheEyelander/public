name: Rizin
on:
  workflow_dispatch:
    inputs:
      url:
        required: true

jobs:
  rizin:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - run: |
          sudo apt-get install --no-install-recommends rizin rz-ghidra
          rizin -q -c "aaa; pdg" "$(curl -LOJ -w "%{filename_effective}" "${{ inputs.url }}")"