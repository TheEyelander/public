name: Compress File
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  compress-file:
    runs-on: ubuntu-26.04
    steps:
      - name: Download
        run: curl -fsSLOJ -b "${{ inputs.cookies }}" "${{ inputs.url }}"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: compressed-file
          path: .
          compression-level: 9
