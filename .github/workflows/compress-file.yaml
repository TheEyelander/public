name: Compress File
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  compress-file:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSLOJ -b "${{ inputs.cookies }}" "${{ inputs.url }}"
      - uses: actions/upload-artifact@main
        with:
          name: ${{ github.job }}
          path: .
