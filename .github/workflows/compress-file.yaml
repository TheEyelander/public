name: Compress File
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  compress-file:
    runs-on: ubuntu-26.04
    steps:
      - name: Download file
        run: curl -fsSLOJ -b "${{ inputs.cookies }}" "${{ inputs.url }}"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
           name: ${{ github.job }}
           path: .
