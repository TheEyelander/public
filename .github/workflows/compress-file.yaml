name: Compress File
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  compress-file:
    runs-on: ubuntu-latest
    steps:
      - name: Compress file
        run: printf "%s\n" "INPUT=$(curl -LOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.url }}")" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ env.INPUT }}

      - uses: actions/upload-artifact@main
        with:
          name: ${{ github.job }}
          path: ${{ env.INPUT }}
