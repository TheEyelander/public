name: Run Rizin
on:
  workflow_dispatch:
    inputs:
      input-url:
        required: true
        
jobs:
  run-rizin:
    runs-on: ubuntu-26.04
    container: rizin/rizin:v0.9.1
    steps:
      - name: Run Rizin
        run: rizin -q -c "aaa; pdg" "$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")" > run-rizin.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: run-rizin.txt
