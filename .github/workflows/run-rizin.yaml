name: Run Rizin
on:
  workflow_dispatch:
    inputs:
      url:
        required: true

jobs:
  run-rizin:
    runs-on: ubuntu-latest
    container: kalilinux/kali-rolling
    steps:
      - name: Run Rizin
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl rizin rz-ghidra
          apt-get install -y --reinstall ca-certificates
          update-ca-certificates --fresh

          rizin -q -c "aa; pdg" "$(curl -LOJ -w "%{filename_effective}" "${{ inputs.url }}")" > "${{ github.job }}.txt"

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          archive: false
          path: ${{ github.job }}.txt
