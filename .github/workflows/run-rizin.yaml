name: Run Rizin
on:
  workflow_dispatch:
    inputs:
      input-url:
        description: Input URL
        required: true
      c:
        required: true
        
jobs:
  run-rizin:
    runs-on: ubuntu-26.04
    container: rizin/rizin:v0.9.1
    steps:
      - name: Run Rizin
        run: |
          rizin -q -c "${{ inputs.c }}" "$(curl -fsSLOJ -w "%{filename_effective}" "${{ inputs.input-url }}")" > "${{ github.job }}.txt"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ github.job }}.txt
