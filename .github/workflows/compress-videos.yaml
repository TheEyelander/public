name: Compress Videos
run-name: Compress Videos (${{ inputs.max-resolution }}p)
on:
  workflow_dispatch:
    inputs:
      input-urls:
        required: true
      input-cookies:
        required: false
      max-resolution:
        options: [1080, 720, 480, 360, 240, 144]
        type: choice

jobs:
  compress-videos:
    strategy:
      matrix:
        input-url: ${{ fromJson(inputs.input-urls) }}
    runs-on: ubuntu-26.04
    steps:
      - name: Download FFmpeg
        run: curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" | tar -xJ -f -

      - name: Download video
        run: printf "%s\n" "INPUT=$(curl -fsSLOJ -w "%{filename_effective}" -b "${{ inputs.input-cookies }}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" "${{ matrix.input-url }}")" >> "$GITHUB_ENV"

      - name: Compress video
        run: |
          ./*/bin/ffmpeg \
            -i "$INPUT" \
            -c:v libx265 \
            -c:a libopus \
            -pix_fmt yuv420p10le \
            -vf "scale='if(gt(iw, ih), -2, min(iw, ${{ inputs.max-resolution }}))':'if(gt(iw, ih), min(ih, ${{ inputs.max-resolution }}), -2)'" \
            "$RUNNER_TEMP/$INPUT"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ runner.temp }}/${{ env.INPUT }}

  merge-artifacts:
    needs: compress-videos
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: merge-artifacts
