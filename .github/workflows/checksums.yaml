name: Checksums
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  checksums:
    runs-on: ubuntu-26.04
    steps:
      - name: Download and calculate
        run: |
          input="$(curl -sSLOJ -w %{filename_effective} -b "${{ inputs.cookies }}" "${{ inputs.url }}")"
          printf "%s\n" "$(cksum -a md5 "$input")" "$(cksum -a sha1 "$input")" "$(cksum -a sha256 "$input")" >> "$GITHUB_STEP_SUMMARY"
