name: Checksum
on:
  workflow_dispatch:
    inputs:
      input-url:
        required: true
      cookies:
        required: false

jobs:
  checksum:
    runs-on: ubuntu-26.04
    steps:
      - name: Checksum
        run: cksum -a sha256 "$(curl -fsSLOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.input-url }}")"