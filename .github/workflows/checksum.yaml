name: Checksum
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
      cookies:
        required: false

jobs:
  checksum:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          input="$(curl -fsSLOJ -w "%{filename_effective}" -b "${{ inputs.cookies }}" "${{ inputs.url }}")"
          printf "%s\n" "$(cksum -a md5 "$input")" "$(cksum -a sha1 "$input")" "$(cksum -a sha256 "$input")" >> "$GITHUB_STEP_SUMMARY"
